<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">Dear Me: Then &amp; Now architecture</title>
  <desc id="desc">User browser connects over HTTPS to a load balancer, then to a Dockerized application with web UI, API, and PostgreSQL, with backups. Supporting services include a container registry, infrastructure as code, and scheduled compute.</desc>
  <rect width="920" height="620" fill="#faf7f2"/>
  <style>
    .box { fill: #fffdf8; stroke: #c9a84c; stroke-width: 1.25; }
    .box-soft { fill: #f4efe6; stroke: #b7a27a; stroke-width: 1.1; }
    .label { fill: #3a3228; font-family: Georgia, "Times New Roman", serif; font-size: 15px; }
    .sub { fill: #6a6156; font-family: Georgia, "Times New Roman", serif; font-size: 12px; }
    .title { fill: #2f4a4a; font-family: Georgia, "Times New Roman", serif; font-size: 20px; }
    .arrow { stroke: #7a2e2e; stroke-width: 1.6; fill: none; marker-end: url(#arrowhead); }
    .small { fill: #3a3228; font-family: Georgia, "Times New Roman", serif; font-size: 13px; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7a2e2e"/>
    </marker>
  </defs>

  <text x="460" y="36" text-anchor="middle" class="title">Dear Me: Then &amp; Now — Application Architecture</text>

  <rect x="360" y="56" width="200" height="48" rx="8" class="box"/>
  <text x="460" y="85" text-anchor="middle" class="label">User Browser</text>

  <line x1="460" y1="104" x2="460" y2="132" class="arrow"/>

  <rect x="360" y="136" width="200" height="48" rx="8" class="box"/>
  <text x="460" y="165" text-anchor="middle" class="label">HTTPS</text>

  <line x1="460" y1="184" x2="460" y2="212" class="arrow"/>

  <rect x="330" y="216" width="260" height="48" rx="8" class="box"/>
  <text x="460" y="245" text-anchor="middle" class="label">AWS Load Balancing</text>

  <line x1="460" y1="264" x2="460" y2="292" class="arrow"/>

  <rect x="250" y="296" width="420" height="168" rx="12" class="box"/>
  <text x="460" y="322" text-anchor="middle" class="label">Dockerized Application</text>

  <rect x="272" y="340" width="116" height="96" rx="8" class="box-soft"/>
  <text x="330" y="382" text-anchor="middle" class="small">Web UI</text>
  <text x="330" y="400" text-anchor="middle" class="sub">React / TanStack</text>

  <rect x="402" y="340" width="116" height="96" rx="8" class="box-soft"/>
  <text x="460" y="382" text-anchor="middle" class="small">API</text>
  <text x="460" y="400" text-anchor="middle" class="sub">Express</text>

  <rect x="532" y="340" width="116" height="96" rx="8" class="box-soft"/>
  <text x="590" y="382" text-anchor="middle" class="small">PostgreSQL</text>
  <text x="590" y="400" text-anchor="middle" class="sub">Relational data</text>

  <line x1="590" y1="464" x2="590" y2="500" class="arrow"/>

  <rect x="490" y="504" width="200" height="48" rx="8" class="box"/>
  <text x="590" y="533" text-anchor="middle" class="label">Backups</text>

  <rect x="48" y="216" width="170" height="72" rx="8" class="box-soft"/>
  <text x="133" y="246" text-anchor="middle" class="small">Container Registry</text>
  <text x="133" y="266" text-anchor="middle" class="sub">Image deployment</text>
  <line x1="218" y1="252" x2="328" y2="240" class="arrow"/>

  <rect x="702" y="216" width="170" height="72" rx="8" class="box-soft"/>
  <text x="787" y="246" text-anchor="middle" class="small">Infrastructure as Code</text>
  <text x="787" y="266" text-anchor="middle" class="sub">AWS resources</text>
  <line x1="702" y1="252" x2="590" y2="240" class="arrow"/>

  <rect x="48" y="504" width="200" height="48" rx="8" class="box-soft"/>
  <text x="148" y="533" text-anchor="middle" class="small">Scheduled Compute</text>
</svg>
